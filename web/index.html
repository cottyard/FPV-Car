<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1114">
  <title>WiFi Camera</title>
  <style>
    :root{color-scheme:dark;--bg:#0b1114;--panel:#111b20;--panel2:#17262b;--line:#2a3a40;--text:#edf6f3;--muted:#8ca09f;--teal:#65e6c4;--danger:#ff766b}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;user-select:none}body{overscroll-behavior:none}button,input{font:inherit}
    .app{max-width:1500px;margin:auto;padding:18px 22px 28px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:18px;padding:4px 0 17px;border-bottom:1px solid var(--line)}
    .brand{display:flex;align-items:center;gap:11px;letter-spacing:.08em}.brand-mark{display:grid;place-items:center;width:34px;height:34px;border:1px solid var(--teal);color:var(--teal);font-weight:800}.brand strong{display:block;font-size:15px}.brand small{display:block;margin-top:1px;color:var(--muted);font-size:10px;letter-spacing:.14em}
    .endpoint{display:flex;align-items:center;gap:7px}.endpoint label{color:var(--muted);font-size:10px;letter-spacing:.12em}.endpoint input{width:200px;padding:8px 9px;border:1px solid var(--line);background:var(--panel);color:var(--text);outline:0}.endpoint input:focus{border-color:var(--teal)}.endpoint button{padding:8px 11px;border:1px solid var(--teal);background:var(--teal);color:#09211c;font-size:11px;font-weight:700;letter-spacing:.08em;cursor:pointer}
    .connection{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:11px;letter-spacing:.06em}.dot{width:8px;height:8px;border-radius:50%;background:var(--danger);box-shadow:0 0 0 3px rgba(255,118,107,.12)}.dot.online{background:var(--teal);box-shadow:0 0 0 3px rgba(101,230,196,.12)}
    .workspace{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(260px,.4fr);gap:22px;padding-top:22px}.video-column{min-width:0}.video-frame{position:relative;overflow:hidden;aspect-ratio:4/3;background:#030708;border:1px solid var(--line)}#stream{display:block;width:100%;height:100%;object-fit:contain;background:#030708}#stream-state{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:11px;letter-spacing:.1em}#stream.loaded+#stream-state{display:none}.video-hud{position:absolute;left:14px;right:14px;top:13px;display:flex;justify-content:space-between;font-size:10px;letter-spacing:.12em}.live{display:inline-flex;align-items:center;gap:6px;color:var(--teal)}.live:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--teal);box-shadow:0 0 10px var(--teal)}.video-footer{display:flex;justify-content:space-between;padding:9px 1px;color:var(--muted);font-size:11px;letter-spacing:.08em}.video-footer span:last-child{color:var(--teal)}
    .status-panel{background:var(--panel);border:1px solid var(--line);align-self:start}.status-section{padding:15px 16px;border-bottom:1px solid var(--line)}.status-section:last-child{border-bottom:0}.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;color:var(--muted);font-size:10px;letter-spacing:.16em;text-transform:uppercase}.section-title strong{color:var(--text);font-size:12px;letter-spacing:.08em}
    .readout{display:grid;grid-template-columns:1fr 1fr;gap:11px 16px}.readout div{min-width:0}.readout dt{color:var(--muted);font-size:10px;letter-spacing:.09em;text-transform:uppercase}.readout dd{margin:3px 0 0;color:var(--text);font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .camera-line{display:flex;justify-content:space-between;color:var(--muted);font-size:11px}.camera-line+.camera-line{margin-top:7px}.camera-line b{color:var(--text);font-weight:500}
    .wifi-list{list-style:none;margin:0 0 10px;padding:0}.wifi-item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:12px}.wifi-item:last-child{border-bottom:0}.wifi-item span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.wifi-current{color:var(--teal);font-style:normal;font-size:10px}.wifi-empty{color:var(--muted);font-size:11px;padding:4px 0}.mini-btn{padding:4px 8px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);font-size:10px;letter-spacing:.08em;cursor:pointer}.mini-btn:hover{color:var(--text)}.mini-btn.danger{border-color:transparent;background:transparent;color:var(--danger)}.wifi-form{display:flex;gap:6px;margin-top:6px}.wifi-form input{flex:1;min-width:0;padding:7px 8px;border:1px solid var(--line);background:var(--panel);color:var(--text);outline:0}.wifi-form input:focus{border-color:var(--teal)}.wifi-form button{padding:7px 10px;border:1px solid var(--teal);background:var(--teal);color:#09211c;font-size:11px;font-weight:700;letter-spacing:.08em;cursor:pointer}.wifi-msg{min-height:14px;margin-top:7px;color:var(--muted);font-size:10px;letter-spacing:.06em}
    @media(max-width:520px){.wifi-form{flex-wrap:wrap}.wifi-form input{flex:1 1 100%}}
    @media(max-width:980px){.topbar{flex-wrap:wrap}.connection{order:3;width:100%}.workspace{grid-template-columns:1fr;gap:12px;padding-top:15px}}
    @media(max-width:520px){.app{padding:12px 10px 22px}.endpoint{width:100%}.endpoint input{flex:1;width:auto}}
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">CAM</span><div><strong>WIFI CAMERA</strong><small>ESP32-S3 FPV</small></div></div>
      <div class="endpoint"><label for="host">ESP32</label><input id="host" value="http://fpv-car.local" spellcheck="false"><button id="connect" type="button">CONNECT</button></div>
      <div class="connection"><span id="connection-dot" class="dot"></span><span id="connection-text">DISCONNECTED</span></div>
    </header>
    <main class="workspace">
      <section class="video-column">
        <div class="video-frame">
          <img id="stream" alt="Live camera stream">
          <div id="stream-state">CONNECT TO VIDEO</div>
          <div class="video-hud"><span class="live">LIVE</span><span id="frame-size">CAMERA</span></div>
        </div>
        <div class="video-footer"><span id="ip">cam.local</span><span>STREAM :81</span></div>
      </section>
      <aside class="status-panel">
        <section class="status-section">
          <div class="section-title"><strong>Network</strong><span id="vehicle-state">OFFLINE</span></div>
          <dl class="readout">
            <div><dt>Signal</dt><dd id="signal">-</dd></div>
            <div><dt>Uptime</dt><dd id="uptime">00:00:00</dd></div>
          </dl>
        </section>
        <section class="status-section">
          <div class="section-title"><strong>Camera</strong></div>
          <div class="camera-line"><span>Frame size</span><b id="camera-frame">-</b></div>
          <div class="camera-line"><span>Quality</span><b id="camera-quality-value">-</b></div>
          <div class="camera-line"><span>Heap free</span><b id="heap">-</b></div>
          <div class="camera-line"><span>PSRAM free</span><b id="psram">-</b></div>
        </section>
        <section class="status-section">
          <div class="section-title"><strong>WiFi Networks</strong><button id="wifi-refresh" type="button" class="mini-btn">REFRESH</button></div>
          <ul id="wifi-list" class="wifi-list"><li class="wifi-empty">-</li></ul>
          <form id="wifi-form" class="wifi-form">
            <input id="wifi-ssid" placeholder="SSID" spellcheck="false" autocomplete="off">
            <input id="wifi-password" placeholder="Password" type="password" spellcheck="false" autocomplete="off">
            <button type="submit">ADD</button>
          </form>
          <div id="wifi-msg" class="wifi-msg"></div>
        </section>
      </aside>
    </main>
  </div>
  <script>
    const $=id=>document.getElementById(id);const hostInput=$("host"),stream=$("stream"),streamState=$("stream-state");const savedHost=localStorage.getItem("camera-esp32-host");let baseUrl=!savedHost||savedHost.includes("192.168.4.1")?hostInput.value:savedHost;hostInput.value=baseUrl;
    function normalize(value){try{const u=new URL(value.indexOf("://")<0?"http://"+value:value);u.pathname="";u.search="";u.hash="";return u.toString().replace(/\/$/,"")}catch{return null}}function streamUrl(){const u=new URL(baseUrl+"/stream");u.port="81";return u.toString()}function setConnection(online){$("connection-dot").classList.toggle("online",online);$("connection-text").textContent=online?"CONNECTED":"DISCONNECTED";$("vehicle-state").textContent=online?"ONLINE":"OFFLINE"}
    function formatUptime(ms){let s=Math.floor(ms/1000),h=Math.floor(s/3600);s%=3600;let m=Math.floor(s/60);s%=60;return[h,m,s].map(v=>String(v).padStart(2,"0")).join(":")}function kb(bytes){return bytes?Math.round(bytes/1024)+" KB":"-"}function renderStatus(d){setConnection(true);$("ip").textContent=d.ip||new URL(baseUrl).hostname;$("uptime").textContent=formatUptime(d.uptime_ms||0);$("signal").textContent=d.wifi_rssi!=null?d.wifi_rssi+" dBm":"-";$("heap").textContent=kb(d.free_heap);$("psram").textContent=kb(d.free_psram);$("camera-frame").textContent=d.framesize??"-";$("frame-size").textContent="F"+String(d.framesize??"-");$("camera-quality-value").textContent=d.quality??"-"}
    function refreshStatus(){fetch(api("/api/status"),{cache:"no-store"}).then(r=>{if(!r.ok)throw Error("status unavailable");return r.json()}).then(renderStatus).catch(()=>setConnection(false))}function api(path){return baseUrl+path}
    function connect(){const next=normalize(hostInput.value.trim());if(!next){setConnection(false);return}baseUrl=next;hostInput.value=next;localStorage.setItem("camera-esp32-host",next);stream.classList.remove("loaded");streamState.textContent="CONNECTING";stream.src=streamUrl();refreshStatus()}function renderWifiList(data){const list=$("wifi-list");list.innerHTML="";(data.networks||[]).forEach((n,i)=>{const li=document.createElement("li");li.className="wifi-item";const name=document.createElement("span");name.textContent=n.ssid;if(data.connected&&n.ssid===data.current){const cur=document.createElement("em");cur.className="wifi-current";cur.textContent=" · connected";name.appendChild(cur)}li.appendChild(name);const btn=document.createElement("button");btn.type="button";btn.className="mini-btn danger";btn.textContent="DEL";btn.onclick=()=>removeWifi(i);li.appendChild(btn);list.appendChild(li)});if(!data.networks||!data.networks.length){const li=document.createElement("li");li.className="wifi-empty";li.textContent="No saved networks";list.appendChild(li)}}
    function loadWifiList(){fetch(api("/api/wifi"),{cache:"no-store"}).then(r=>{if(!r.ok)throw Error("wifi unavailable");return r.json()}).then(renderWifiList).catch(()=>{})}
    function addWifi(e){e.preventDefault();const ssid=$("wifi-ssid").value.trim();if(!ssid)return;const password=$("wifi-password").value;$("wifi-msg").textContent="Saving...";fetch(api("/api/wifi?ssid="+encodeURIComponent(ssid)+"&password="+encodeURIComponent(password)),{method:"POST"}).then(r=>r.json()).then(()=>{$("wifi-msg").textContent="Saved, restarting..."}).catch(()=>{$("wifi-msg").textContent="Failed to save"})}
    function removeWifi(index){$("wifi-msg").textContent="Removing...";fetch(api("/api/wifi?index="+index),{method:"DELETE"}).then(r=>r.json()).then(()=>{$("wifi-msg").textContent="Removed, restarting..."}).catch(()=>{$("wifi-msg").textContent="Failed to remove"})}
    $("wifi-form").addEventListener("submit",addWifi);$("wifi-refresh").addEventListener("click",loadWifiList);
    $("connect").addEventListener("click",connect);hostInput.addEventListener("keydown",e=>{if(e.key==="Enter")connect()});stream.addEventListener("load",()=>{stream.classList.add("loaded");streamState.textContent=""});stream.addEventListener("error",()=>{stream.classList.remove("loaded");streamState.textContent="VIDEO RECONNECTING"});connect();setInterval(refreshStatus,1000);setInterval(loadWifiList,3000);
  </script>
</body>
</html>
