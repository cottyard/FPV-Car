<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1114">
  <title>Pioneer FPV Control</title>
  <style>
    :root{color-scheme:dark;--bg:#0b1114;--panel:#111b20;--panel2:#17262b;--line:#2a3a40;--text:#edf6f3;--muted:#8ca09f;--teal:#65e6c4;--amber:#f6b73c;--danger:#ff766b}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;user-select:none}body{overscroll-behavior:none}button,input{font:inherit}
    .app{max-width:1500px;margin:auto;padding:18px 22px 28px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:18px;padding:4px 0 17px;border-bottom:1px solid var(--line)}
    .brand{display:flex;align-items:center;gap:11px;letter-spacing:.08em}.brand-mark{display:grid;place-items:center;width:34px;height:34px;border:1px solid var(--teal);color:var(--teal);font-weight:800}.brand strong{display:block;font-size:15px}.brand small{display:block;margin-top:1px;color:var(--muted);font-size:10px;letter-spacing:.14em}
    .endpoint{display:flex;align-items:center;gap:7px}.endpoint label{color:var(--muted);font-size:10px;letter-spacing:.12em}.endpoint input{width:180px;padding:8px 9px;border:1px solid var(--line);background:var(--panel);color:var(--text);outline:0}.endpoint input:focus{border-color:var(--teal)}.endpoint button{padding:8px 11px;border:1px solid var(--teal);background:var(--teal);color:#09211c;font-size:11px;font-weight:700;letter-spacing:.08em;cursor:pointer}
    .connection{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:11px;letter-spacing:.06em}.dot{width:8px;height:8px;border-radius:50%;background:var(--danger);box-shadow:0 0 0 3px rgba(255,118,107,.12)}.dot.online{background:var(--teal);box-shadow:0 0 0 3px rgba(101,230,196,.12)}
    .workspace{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(310px,.75fr);gap:22px;padding-top:22px}.video-column{min-width:0}.video-frame{position:relative;overflow:hidden;aspect-ratio:4/3;background:#030708;border:1px solid var(--line)}#stream{display:block;width:100%;height:100%;object-fit:contain;background:#030708}#stream-state{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:11px;letter-spacing:.1em}#stream.loaded+#stream-state{display:none}.video-hud{position:absolute;left:14px;right:14px;top:13px;display:flex;justify-content:space-between;font-size:10px;letter-spacing:.12em}.live{display:inline-flex;align-items:center;gap:6px;color:var(--teal)}.live:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--teal);box-shadow:0 0 10px var(--teal)}.video-footer{display:flex;justify-content:space-between;padding:9px 1px;color:var(--muted);font-size:11px;letter-spacing:.08em}.video-footer span:last-child{color:var(--teal)}
    .control-column{background:var(--panel);border:1px solid var(--line)}.control-section{padding:17px 18px;border-bottom:1px solid var(--line)}.control-section:last-child{border-bottom:0}.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px;color:var(--muted);font-size:10px;letter-spacing:.16em;text-transform:uppercase}.section-title strong{color:var(--text);font-size:12px;letter-spacing:.08em}
    .drive-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;max-width:260px;margin:auto}.drive-pad button{aspect-ratio:1.28;border:1px solid var(--line);background:var(--panel2);color:var(--text);cursor:pointer;touch-action:none;transition:background .15s,border-color .15s,transform .08s}.drive-pad button:hover{border-color:#557078}.drive-pad button:active,.drive-pad button.active{transform:translateY(1px);border-color:var(--teal);background:#1c403d;color:var(--teal)}.drive-pad .stop{border-color:#6d413a;color:var(--danger)}.drive-pad .stop:active,.drive-pad .stop.active{background:#432624;border-color:var(--danger);color:#ffb0a8}.arrow{display:block;font-size:23px;line-height:1}.drive-label{display:block;margin-top:5px;color:var(--muted);font-size:9px;letter-spacing:.08em}
    .speed-row{display:flex;align-items:center;gap:12px}.speed-row input{width:100%;accent-color:var(--teal)}.speed-value{min-width:42px;color:var(--teal);text-align:right;font-variant-numeric:tabular-nums}.light-button{display:flex;justify-content:space-between;width:100%;padding:11px 12px;border:1px solid var(--line);background:transparent;color:var(--text);cursor:pointer}.light-button.on{border-color:var(--amber);color:var(--amber)}.light-button span:last-child{color:var(--muted);font-size:11px}
    .readout{display:grid;grid-template-columns:1fr 1fr;gap:11px 16px}.readout div{min-width:0}.readout dt{color:var(--muted);font-size:10px;letter-spacing:.09em;text-transform:uppercase}.readout dd{margin:3px 0 0;color:var(--text);font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.camera-line{display:flex;justify-content:space-between;color:var(--muted);font-size:11px}.camera-line+.camera-line{margin-top:7px}.camera-line b{color:var(--text);font-weight:500}.footer-note{padding-top:17px;color:var(--muted);font-size:11px;letter-spacing:.04em}.footer-note span{color:var(--teal)}
    @media(max-width:980px){.topbar{flex-wrap:wrap}.connection{order:3;width:100%}.workspace{grid-template-columns:1fr;gap:8px;padding-top:15px}.control-column{display:grid;grid-template-columns:1fr 1fr}.control-section{padding:14px}.control-section:first-child,.control-section:last-child{grid-column:1/-1}}
    @media(max-width:520px){.app{padding:12px 10px 22px}.endpoint{width:100%}.endpoint input{flex:1;width:auto}.control-column{display:block}.control-section{padding:15px 14px}}
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">P</span><div><strong>PIONEER</strong><small>LOCAL FPV CONTROL</small></div></div>
      <div class="endpoint"><label for="host">ESP32</label><input id="host" value="http://fpv-car.local" spellcheck="false"><button id="connect" type="button">CONNECT</button></div>
      <div class="connection"><span id="connection-dot" class="dot"></span><span id="connection-text">DISCONNECTED</span></div>
    </header>
    <main class="workspace">
      <section class="video-column"><div class="video-frame"><img id="stream" alt="Live camera stream"><div id="stream-state">CONNECT TO VIDEO</div><div class="video-hud"><span class="live">LIVE</span><span id="frame-size">CAMERA</span></div></div><div class="video-footer"><span id="ip">fpv-car.local</span><span>STREAM :81</span></div></section>
      <aside class="control-column">
        <section class="control-section"><div class="section-title"><strong>Drive</strong><span id="motion-readout">STOP</span></div><div class="drive-pad"><span></span><button data-dir="forward" aria-label="Forward"><span class="arrow">&#8593;</span><span class="drive-label">FORWARD</span></button><span></span><button data-dir="left" aria-label="Left"><span class="arrow">&#8592;</span><span class="drive-label">LEFT</span></button><button class="stop" data-dir="stop" aria-label="Stop"><span class="arrow">&#9632;</span><span class="drive-label">STOP</span></button><button data-dir="right" aria-label="Right"><span class="arrow">&#8594;</span><span class="drive-label">RIGHT</span></button><span></span><button data-dir="back" aria-label="Backward"><span class="arrow">&#8595;</span><span class="drive-label">BACK</span></button><span></span></div></section>
        <section class="control-section"><div class="section-title"><strong>Speed</strong><span id="speed-value">45 PWM</span></div><div class="speed-row"><input id="speed" type="range" min="25" max="100" value="45"><span class="speed-value" id="speed-number">45</span></div></section>
        <section class="control-section"><div class="section-title"><strong>Lighting</strong></div><button id="light-button" class="light-button" type="button"><span>HEADLIGHT</span><span id="light-state">OFF</span></button></section>
        <section class="control-section"><div class="section-title"><strong>Vehicle</strong><span id="vehicle-state">OFFLINE</span></div><dl class="readout"><div><dt>Motion</dt><dd id="motion">STOP</dd></div><div><dt>Speed</dt><dd id="speed-readout">0 PWM</dd></div><div><dt>Signal</dt><dd id="signal">-</dd></div><div><dt>Uptime</dt><dd id="uptime">00:00:00</dd></div><div><dt>Heap free</dt><dd id="heap">-</dd></div><div><dt>PSRAM free</dt><dd id="psram">-</dd></div></dl></section>
        <section class="control-section"><div class="section-title"><strong>Camera</strong><span id="camera-quality">-</span></div><div class="camera-line"><span>Frame size</span><b id="camera-frame">-</b></div><div class="camera-line"><span>Quality</span><b id="camera-quality-value">-</b></div><div class="footer-note">Safety timeout <span>900 ms</span></div></section>
      </aside>
    </main>
  </div>
  <script>
    const $=id=>document.getElementById(id);const hostInput=$("host"),stream=$("stream"),streamState=$("stream-state"),speed=$("speed");const savedHost=localStorage.getItem("pioneer-esp32-host");let baseUrl=!savedHost||savedHost.includes("192.168.4.1")?hostInput.value:savedHost,activeDirection=null,heartbeat=null,lastLight=false,legacyMode=false;const held=new Set(),order=["forward","back","left","right"],keys={ArrowUp:"forward",ArrowDown:"back",ArrowLeft:"left",ArrowRight:"right",w:"forward",s:"back",a:"left",d:"right",W:"forward",S:"back",A:"left",D:"right"},label={forward:"FORWARD",back:"BACK",left:"LEFT",right:"RIGHT",stop:"STOP"},legacyPath={forward:"/go",back:"/back",left:"/left",right:"/right",stop:"/stop"};hostInput.value=baseUrl;
    function normalize(value){try{const u=new URL(value.indexOf("://")<0?"http://"+value:value);u.pathname="";u.search="";u.hash="";return u.toString().replace(/\/$/,"")}catch{return null}}function api(path){return baseUrl+path}function streamUrl(){const u=new URL(baseUrl+"/stream");u.port="81";return u.toString()}function setConnection(online){$("connection-dot").classList.toggle("online",online);$("connection-text").textContent=online?(legacyMode?"LEGACY":"CONNECTED"):"DISCONNECTED";$("vehicle-state").textContent=online?(legacyMode?"LEGACY API":"ONLINE"):"OFFLINE"}function markMotion(dir,value){$("motion-readout").textContent=label[dir]||"STOP";$("motion").textContent=label[dir]||"STOP";$("speed-readout").textContent=(value||0)+" PWM";document.querySelectorAll("[data-dir]").forEach(b=>b.classList.toggle("active",b.dataset.dir===dir))}
    function legacyRequest(path){return fetch(api(path),{mode:"no-cors",cache:"no-store"}).then(()=>{legacyMode=true;setConnection(true)}).catch(()=>{setConnection(false)})}function request(path,fallback){return fetch(api(path),{cache:"no-store"}).then(r=>{if(!r.ok)throw Error("request failed");setConnection(true);return r}).catch(()=>fallback?legacyRequest(fallback):(setConnection(false),null))}function currentDirection(){for(const dir of order)if(held.has(dir))return dir;return null}function drive(dir){if(!dir){stopDrive();return}activeDirection=dir;markMotion(dir,Number(speed.value));request("/api/drive?dir="+encodeURIComponent(dir)+"&speed="+speed.value,legacyPath[dir]);if(!heartbeat)heartbeat=setInterval(()=>{if(activeDirection)request("/api/drive?dir="+activeDirection+"&speed="+speed.value,legacyPath[activeDirection])},260)}function stopDrive(){held.clear();activeDirection=null;if(heartbeat){clearInterval(heartbeat);heartbeat=null}markMotion("stop",0);request("/api/drive?dir=stop",legacyPath.stop)}
    function press(dir,e){if(e)e.preventDefault();held.add(dir);drive(currentDirection())}function release(dir,e){if(e)e.preventDefault();held.delete(dir);const next=currentDirection();if(next)drive(next);else stopDrive()}document.querySelectorAll("[data-dir]").forEach(button=>{const dir=button.dataset.dir;if(dir==="stop"){button.addEventListener("pointerdown",stopDrive);return}button.addEventListener("pointerdown",e=>{button.setPointerCapture(e.pointerId);press(dir,e)});button.addEventListener("pointerup",e=>release(dir,e));button.addEventListener("pointercancel",e=>release(dir,e))});window.addEventListener("keydown",e=>{const dir=keys[e.key];if(!dir)return;e.preventDefault();if(!held.has(dir))press(dir,e)});window.addEventListener("keyup",e=>{const dir=keys[e.key];if(dir)release(dir,e)});window.addEventListener("blur",stopDrive);document.addEventListener("visibilitychange",()=>{if(document.hidden)stopDrive()});
    speed.addEventListener("input",()=>{$("speed-value").textContent=speed.value+" PWM";$("speed-number").textContent=speed.value;if(activeDirection)drive(activeDirection)});$("light-button").addEventListener("click",()=>{lastLight=!lastLight;request("/api/light?on="+(lastLight?1:0),lastLight?"/ledon":"/ledoff").then(refreshStatus)});
    function formatUptime(ms){let s=Math.floor(ms/1000),h=Math.floor(s/3600);s%=3600;let m=Math.floor(s/60);s%=60;return[h,m,s].map(v=>String(v).padStart(2,"0")).join(":")}function kb(bytes){return bytes?Math.round(bytes/1024)+" KB":"-"}function renderStatus(d){setConnection(true);$("ip").textContent=d.ip||new URL(baseUrl).hostname;$("uptime").textContent=formatUptime(d.uptime_ms||0);$("heap").textContent=kb(d.free_heap);$("psram").textContent=kb(d.free_psram);$("signal").textContent=d.wifi_rssi!=null?d.wifi_rssi+" dBm":"-";$("motion").textContent=d.motion||"STOP";$("motion-readout").textContent=d.motion||"STOP";$("speed-readout").textContent=(d.speed||0)+" PWM";$("camera-frame").textContent=d.framesize??"-";$("frame-size").textContent="F"+String(d.framesize??"-");$("camera-quality-value").textContent=d.quality??"-";$("camera-quality").textContent="Q "+(d.quality??"-");lastLight=!!d.light;$("light-state").textContent=lastLight?"ON":"OFF";$("light-button").classList.toggle("on",lastLight)}function probeLegacy(){return legacyRequest("/stop").then(()=>{$("camera-quality").textContent="LEGACY"})}function refreshStatus(){if(legacyMode)return;fetch(api("/api/status"),{cache:"no-store"}).then(r=>{if(!r.ok)throw Error("status unavailable");return r.json()}).then(renderStatus).catch(probeLegacy)}
    function connect(){const next=normalize(hostInput.value.trim());if(!next){setConnection(false);return}baseUrl=next;hostInput.value=next;localStorage.setItem("pioneer-esp32-host",next);legacyMode=false;stream.classList.remove("loaded");streamState.textContent="CONNECTING";stream.src=streamUrl();refreshStatus()}$("connect").addEventListener("click",connect);hostInput.addEventListener("keydown",e=>{if(e.key==="Enter")connect()});stream.addEventListener("load",()=>{stream.classList.add("loaded");streamState.textContent=""});stream.addEventListener("error",()=>{stream.classList.remove("loaded");streamState.textContent="VIDEO RECONNECTING"});connect();setInterval(refreshStatus,1000);
  </script>
</body>
</html>
