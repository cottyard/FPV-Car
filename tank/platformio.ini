[platformio]
default_envs = esp32dev

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -D CORE_DEBUG_LEVEL=0

; 默认环境：通过 WiFi OTA 上传（需先串口刷一次带 OTA 的固件）
[env:esp32dev]
upload_protocol = espota
upload_port = esp32-tank.local

; 应急/首次环境：通过 USB 串口上传
[env:serial]
upload_speed = 460800
upload_port = COM4
upload_protocol = esptool